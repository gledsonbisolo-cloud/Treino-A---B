<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino A+B">
<title>Treino A + B — Checklist</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111;background:#f2f2f2;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#f2f2f2;min-height:100%;}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
button,input{font:inherit;}
.app{width:100%;max-width:1100px;margin:0 auto;padding:10px 8px 28px;}
.header{position:sticky;top:0;z-index:20;background:rgba(242,242,242,.96);backdrop-filter:blur(12px);padding:6px 4px 8px;}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tab{border:0;border-radius:14px;padding:13px 10px;font-weight:900;font-size:18px;background:#ddd;color:#111;box-shadow:0 2px 7px rgba(0,0,0,.12);min-height:50px;touch-action:manipulation;}
.tab.active{background:#ffd400;}
.controls{display:flex;gap:8px;margin-top:8px;}
.action{flex:1;border:1px solid #bbb;border-radius:12px;background:#fff;padding:11px 8px;font-weight:800;font-size:14px;min-height:46px;touch-action:manipulation;}
.action.primary{background:#111;color:#fff;border-color:#111;}
.workout{display:none;padding-top:4px;}
.workout.active{display:block;}
.workout-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 4px 4px;}
.workout-heading h2{margin:0;font-size:19px;font-weight:900;}
.counter{font-size:13px;font-weight:800;white-space:nowrap;}
.progress-track{height:8px;background:#d8d8d8;border-radius:99px;overflow:hidden;margin:0 4px 9px;}
.progress-fill{height:100%;width:0;background:#ffd400;transition:width .15s ease;}
.poster-wrap{position:relative;width:100%;line-height:0;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);}
.poster{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}
.exercise-check{position:absolute;transform:translate(-50%,-50%);width:11%;height:5.3%;z-index:5;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
.exercise-check input{position:absolute;opacity:0;width:1px;height:1px;}
.exercise-check span{display:block;width:min(44px,72%);aspect-ratio:1;border:3px solid #111;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);position:relative;}
.exercise-check input:checked + span{background:#ffd400;}
.exercise-check input:checked + span::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#111;font-size:clamp(22px,6vw,38px);font-weight:1000;line-height:1;}
.charge-edit{position:absolute;left:94%;transform:translate(-50%,-50%);width:8.8%;height:5.25%;z-index:6;border:2px solid #d4ad00;border-radius:7px;background:rgba(255,255,255,.97);color:#111;text-align:center;font-weight:900;font-size:clamp(12px,4vw,24px);line-height:1;padding:0 1px;min-width:0;outline:none;touch-action:manipulation;}
.charge-edit:focus{border-color:#111;box-shadow:0 0 0 2px #ffd400;}
.help{font-size:12px;color:#555;text-align:center;margin:8px 2px 0;line-height:1.35;}
@media (min-width:700px){.app{padding:14px 16px 36px;}.tab{font-size:20px;}}
@media print{.header,.help{display:none}.workout{display:block!important}.workout:not(:last-child){break-after:page}.app{max-width:none;padding:0}.poster-wrap{box-shadow:none;border-radius:0}}
</style>
</head>
<body>
<div class="app">
<header class="header">
 <div class="tabs">
  <button class="tab active" data-tab="a" type="button" aria-pressed="true">TREINO A</button>
  <button class="tab" data-tab="b" type="button" aria-pressed="false">TREINO B</button>
 </div>
 <div class="controls">
  <button class="action primary" id="resetBtn" type="button">↻ Zerar marcações</button>
 </div>
</header>
<section class="workout" id="workout-a" aria-labelledby="title-a">

  <div class="poster-wrap">
    <img class="poster" src="./treino-a-poster.png" alt="Infográfico do Treino A ajustado com os dez exercícios, equipamentos, grupos musculares, séries, repetições e cargas.">
    <label class="exercise-check" style="left:11.55%; top:21.34%;" aria-label="Marcar exercício 1"><input type="checkbox" data-exercise="1" id="a-ex-1"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:28.54%;" aria-label="Marcar exercício 2"><input type="checkbox" data-exercise="2" id="a-ex-2"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:35.78%;" aria-label="Marcar exercício 3"><input type="checkbox" data-exercise="3" id="a-ex-3"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:43.02%;" aria-label="Marcar exercício 4"><input type="checkbox" data-exercise="4" id="a-ex-4"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:50.57%;" aria-label="Marcar exercício 5"><input type="checkbox" data-exercise="5" id="a-ex-5"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:57.35%;" aria-label="Marcar exercício 6"><input type="checkbox" data-exercise="6" id="a-ex-6"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:63.95%;" aria-label="Marcar exercício 7"><input type="checkbox" data-exercise="7" id="a-ex-7"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:70.73%;" aria-label="Marcar exercício 8"><input type="checkbox" data-exercise="8" id="a-ex-8"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:77.29%;" aria-label="Marcar exercício 9"><input type="checkbox" data-exercise="9" id="a-ex-9"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:84.64%;" aria-label="Marcar exercício 10"><input type="checkbox" data-exercise="10" id="a-ex-10"><span></span></label>
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="1" data-default="—" value="—" style="top:21.42%;" aria-label="Carga do exercício 1">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="2" data-default="10" value="10" style="top:28.73%;" aria-label="Carga do exercício 2">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="3" data-default="—" value="—" style="top:35.75%;" aria-label="Carga do exercício 3">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="4" data-default="10" value="10" style="top:43.22%;" aria-label="Carga do exercício 4">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="5" data-default="40" value="40" style="top:50.57%;" aria-label="Carga do exercício 5">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="6" data-default="25" value="25" style="top:57.32%;" aria-label="Carga do exercício 6">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="7" data-default="5" value="5" style="top:64.00%;" aria-label="Carga do exercício 7">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="8" data-default="7" value="7" style="top:70.58%;" aria-label="Carga do exercício 8">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="9" data-default="4" value="4" style="top:77.32%;" aria-label="Carga do exercício 9">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="10" data-default="4" value="4" style="top:83.77%;" aria-label="Carga do exercício 10">
  </div>
</section>
<section class="workout" id="workout-b" aria-labelledby="title-b">
  <div class="workout-heading"><h2 id="title-b">TREINO B — AJUSTADO</h2><div class="counter" id="counter-b">0 de 10</div></div>
  <div class="progress-track" id="progress-b" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div class="progress-fill"></div></div>
  <div class="poster-wrap">
    <img class="poster" src="./treino-b-poster.png" alt="Infográfico do Treino B ajustado com os dez exercícios, equipamentos, grupos musculares, séries, repetições e cargas.">
    <label class="exercise-check" style="left:11.55%; top:20.92%;" aria-label="Marcar exercício 1"><input type="checkbox" data-exercise="1" id="b-ex-1"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:27.99%;" aria-label="Marcar exercício 2"><input type="checkbox" data-exercise="2" id="b-ex-2"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:34.91%;" aria-label="Marcar exercício 3"><input type="checkbox" data-exercise="3" id="b-ex-3"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:41.96%;" aria-label="Marcar exercício 4"><input type="checkbox" data-exercise="4" id="b-ex-4"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:48.82%;" aria-label="Marcar exercício 5"><input type="checkbox" data-exercise="5" id="b-ex-5"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:55.30%;" aria-label="Marcar exercício 6"><input type="checkbox" data-exercise="6" id="b-ex-6"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:61.70%;" aria-label="Marcar exercício 7"><input type="checkbox" data-exercise="7" id="b-ex-7"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:67.95%;" aria-label="Marcar exercício 8"><input type="checkbox" data-exercise="8" id="b-ex-8"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:74.39%;" aria-label="Marcar exercício 9"><input type="checkbox" data-exercise="9" id="b-ex-9"><span></span></label>
<label class="exercise-check" style="left:11.55%; top:82.24%;" aria-label="Marcar exercício 10"><input type="checkbox" data-exercise="10" id="b-ex-10"><span></span></label>
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="1" data-default="25" value="25" style="top:21.38%;" aria-label="Carga do exercício 1">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="2" data-default="5" value="5" style="top:28.70%;" aria-label="Carga do exercício 2">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="3" data-default="35" value="35" style="top:35.78%;" aria-label="Carga do exercício 3">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="4" data-default="20" value="20" style="top:42.95%;" aria-label="Carga do exercício 4">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="5" data-default="25" value="25" style="top:49.96%;" aria-label="Carga do exercício 5">

<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="9" data-default="—" value="—" style="top:76.29%;" aria-label="Carga do exercício 9">
<input class="charge-edit" type="text" inputmode="decimal" autocomplete="off" data-charge="10" data-default="—" value="—" style="top:83.27%;" aria-label="Carga do exercício 10">
  </div>
</section>
<p class="help">Toque no checkbox para marcar. Toque no valor da carga para editar. As marcações e cargas ficam salvas neste navegador. Não há sincronização automática entre aparelhos.</p>
</div>
<script>
(() => {
 const tabs=[...document.querySelectorAll('.tab')];
 const workouts={a:document.getElementById('workout-a'),b:document.getElementById('workout-b')};
 const keys={a:'treino-ab-a-v1',b:'treino-ab-b-v1'};
 function activate(k){tabs.forEach(t=>{const active=t.dataset.tab===k;t.classList.toggle('active',active);t.setAttribute('aria-pressed',String(active));});Object.entries(workouts).forEach(([id,el])=>el.classList.toggle('active',id===k));try{localStorage.setItem('treino-ab-tab',k);}catch(e){}}
 tabs.forEach(t=>t.addEventListener('click',()=>activate(t.dataset.tab)));
 function setup(k){
  const root=workouts[k]; const boxes=[...root.querySelectorAll('input[data-exercise]')]; const charges=[...root.querySelectorAll('input[data-charge]')];
  const counter=root.querySelector('.counter'), track=root.querySelector('.progress-track'), fill=root.querySelector('.progress-fill');
  try{const saved=JSON.parse(localStorage.getItem(keys[k])||'null');if(saved?.boxes) boxes.forEach((b,i)=>b.checked=!!saved.boxes[i]);if(saved?.charges) charges.forEach((c,i)=>{if(typeof saved.charges[i]==='string')c.value=saved.charges[i];})}catch(e){}
  function save(){try{localStorage.setItem(keys[k],JSON.stringify({boxes:boxes.map(b=>b.checked),charges:charges.map(c=>c.value)}))}catch(e){}}
  function update(){const n=boxes.filter(b=>b.checked).length;counter.textContent=`${n} de 10`;fill.style.width=`${n*10}%`;track.setAttribute('aria-valuenow',n)}
  boxes.forEach(b=>b.addEventListener('change',()=>{save();update()}));
  charges.forEach(c=>{c.addEventListener('input',save);c.addEventListener('focus',()=>c.select());});
  update();
  return {boxes,charges,save,update};
 }
 const states={a:setup('a'),b:setup('b')};
 document.getElementById('resetBtn').addEventListener('click',()=>{const k=document.querySelector('.tab.active').dataset.tab;states[k].boxes.forEach(b=>b.checked=false);states[k].save();states[k].update();});
  let initial='a';try{const s=localStorage.getItem('treino-ab-tab');if(s==='b')initial='b';}catch(e){}activate(initial);
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); }</script>
</body>
</html>
